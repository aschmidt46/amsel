[package]
name = "antons-gbc-emu"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"

[lib]
crate-type = ["staticlib"]
name = "cgbcore"
path = "src/bridge.rs"

# [[bin]]
# name = "antons-gbc-emu"
# path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
# debug = true

[profile.dev]
opt-level = 3
lto = true
strip = true
overflow-checks = false

[dependencies]
arr_macro = "0.2.1"
bytes = "1.11.1"
cxx = "1.0.194"
env_logger = "0.11.10"
lazy_static = "1.5.0"
serde = "1.0.228"
serde_json = "1.0.149"
smol_str = "0.3.6"

[build-dependencies]
cxx-build = "1.0.194"


[features]

cgb = [] # (Keine Abhängigkeiten)
libretro = []

